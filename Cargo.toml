[package]
name = "converter-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "converter_core"

[[bin]]
name = "converter"
path = "src/bin/converter.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
which = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "qoi", "tga", "tiff", "webp"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = { version = "0.9", features = ["preserve_order"] }
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
