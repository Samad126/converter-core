name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optional engines the engine-dependent tests use when present (they skip quietly otherwise): assimp for the 3D
      # formats, ffmpeg for the media containers, 7-Zip for .lzma/.zipx, poppler's pdftotext for the PDF text checks.
      - name: Optional engines for the integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends assimp-utils ffmpeg p7zip-full poppler-utils
      - run: cargo build --all-targets
      - run: cargo test

  # The part unit tests cannot cover: really download LibreOffice with our installer (checksum, msiexec / hdiutil
  # unpack, no admin rights) and convert a document with the copy it put in the engines folder.
  libreoffice:
    name: LibreOffice install + convert (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engines folder for this run
        shell: bash
        run: echo "CONVERTER_ENGINES_DIR=$RUNNER_TEMP/engines" >> "$GITHUB_ENV"
      - name: Install LibreOffice through the app's installer
        shell: bash
        run: |
          cargo run -q --bin converter -- engines install libreoffice
          cargo run -q --bin converter -- engines list | tee list.txt
          grep -E "^libreoffice +installed" list.txt | grep -q "engines"   # it must be OUR copy, not a system one
      - name: Convert with it
        shell: bash
        run: |
          printf 'Hello from CI\n' > "$RUNNER_TEMP/hello.txt"
          cargo run -q --bin converter -- convert pdf  "$RUNNER_TEMP/hello.txt"
          cargo run -q --bin converter -- convert docx "$RUNNER_TEMP/hello.txt"
          ls -l "$RUNNER_TEMP"
          head -c 5 "$RUNNER_TEMP/hello.pdf" | grep -q '%PDF'
          test -s "$RUNNER_TEMP/hello.docx"

  # Calibre is the heaviest engine and has a different package type on every platform (tarball / MSI / DMG).
  calibre:
    name: Calibre install + convert (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engines folder for this run
        shell: bash
        run: echo "CONVERTER_ENGINES_DIR=$RUNNER_TEMP/engines" >> "$GITHUB_ENV"
      - name: System libraries Calibre itself needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0 libxkbcommon0
      - name: Install Calibre through the app's installer
        shell: bash
        run: |
          cargo run -q --bin converter -- engines install calibre
          cargo run -q --bin converter -- engines list | tee list.txt
          grep -E "^calibre +installed" list.txt | grep -q "engines"   # it must be OUR copy
      - name: Convert an ebook with it
        shell: bash
        run: |
          python3 tools/make_tiny_epub.py "$RUNNER_TEMP/book.epub"
          cargo run -q --bin converter -- convert mobi "$RUNNER_TEMP/book.epub"
          cargo run -q --bin converter -- convert azw3 "$RUNNER_TEMP/book.epub"
          ls -l "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/book.mobi"
          test -s "$RUNNER_TEMP/book.azw3"

  # The app's own Python: download a portable CPython, pip-install the packages into it, and convert with nothing else
  # on the machine (CONVERTER_BIN_PYTHON is not set, and the system Python has none of these packages).
  python:
    name: bundled Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engines folder for this run
        shell: bash
        run: echo "CONVERTER_ENGINES_DIR=$RUNNER_TEMP/engines" >> "$GITHUB_ENV"
      - name: Without it, the conversion asks for the Python tools
        shell: bash
        run: |
          python3 tools/make_tiny_pdf.py "$RUNNER_TEMP/tiny.pdf" "Hello from CI"
          cargo run -q --bin converter -- convert docx "$RUNNER_TEMP/tiny.pdf" 2>&1 | tee out.txt || true
          grep -q "E_ENGINE_MISSING" out.txt
      - name: Install the Python tools through the app's installer
        shell: bash
        run: |
          cargo run -q --bin converter -- engines install python
          cargo run -q --bin converter -- engines list | tee list.txt
          grep -E "^python +installed" list.txt | grep -q "engines"
      - name: Convert with it
        shell: bash
        run: |
          cargo run -q --bin converter -- convert docx "$RUNNER_TEMP/tiny.pdf"
          cargo run -q --bin converter -- convert markdown "$RUNNER_TEMP/tiny.pdf"
          grep -q "Hello from CI" "$RUNNER_TEMP/tiny.md"
          printf 'name,city\nAnn,Baku\n' > "$RUNNER_TEMP/t.csv"
          cargo run -q --bin converter -- convert parquet "$RUNNER_TEMP/t.csv"
          cargo run -q --bin converter -- convert csv "$RUNNER_TEMP/t.parquet" --out "$RUNNER_TEMP/back"
          grep -q "Ann,Baku" "$RUNNER_TEMP/back/t.csv"
          ls -l "$RUNNER_TEMP"
